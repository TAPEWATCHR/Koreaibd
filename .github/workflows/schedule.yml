
name: Daily KR Stock Data Update

on:
  schedule:
    # 매일 한국 시간 오후 4시 30분 (UTC 07:30)
    - cron: '30 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 체크아웃
      uses: actions/checkout@v4

    - name: 파이썬 환경 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 필수 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 데이터 수집 및 계산기 실행
      env:
        DART_API_KEY: ${{ secrets.DART_API_KEY }}
      run: |
        python kr_update_data.py

   
    - name: RS 이력 DB 저장 확인
      run: |
        python - <<'PY'
        import sqlite3
        import os

        db_path = "kr_ibd_system.db"
        conn = sqlite3.connect(db_path)
        cur = conn.cursor()
        # 과거에 저장된 YYYYMMDD 형식을 YYYY-MM-DD로 통일
        cur.execute("""
            UPDATE rs_history
            SET date = substr(date, 1, 4) || '-' ||
                       substr(date, 5, 2) || '-' ||
                       substr(date, 7, 2)
            WHERE length(date) = 8
              AND date GLOB '[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]'
        """)

        print(f"날짜 형식 변경 기록 수: {cur.rowcount}")
        conn.commit()

        cur.execute("""
            SELECT COUNT(*), MIN(date), MAX(date)
            FROM rs_history
        """)
        total, first_date, latest_date = cur.fetchone()

        print(f"RS 이력 전체 기록 수: {total}")
        print(f"문자열 기준 최초 날짜: {first_date}")
        print(f"문자열 기준 최신 날짜: {latest_date}")

        cur.execute("""
            SELECT COUNT(*)
            FROM rs_history
            WHERE length(date) = 8
        """)
        compact_count = cur.fetchone()[0]
        print(f"하이픈 없는 8자리 날짜 기록 수: {compact_count}")

        print("하이픈 없는 날짜 상위 10개:")
        cur.execute("""
            SELECT date, COUNT(*)
            FROM rs_history
            WHERE length(date) = 8
            GROUP BY date
            ORDER BY date DESC
            LIMIT 10
        """)
        for date, count in cur.fetchall():
            print(f"  {date}: {count}건")

        cur.execute("""
            SELECT COUNT(*)
            FROM rs_history a
            JOIN rs_history b
              ON a.symbol = b.symbol
             AND a.date = replace(b.date, '-', '')
            WHERE length(a.date) = 8
              AND length(b.date) = 10
        """)
        collision_count = cur.fetchone()[0]
        print(f"날짜 통일 시 충돌 가능성이 있는 기록 쌍: {collision_count}")

        print("최근 날짜별 기록:")
        cur.execute("""
            SELECT date, COUNT(DISTINCT symbol), COUNT(*)
            FROM rs_history
            GROUP BY date
            ORDER BY date DESC
            LIMIT 5
        """)
        for date, symbols, records in cur.fetchall():
            print(f"  {date}: 종목 {symbols}개, 기록 {records}건")

        conn.close()
        PY


    - name: 변경된 DB 파일 깃허브에 업로드
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add kr_ibd_system.db
        git diff --quiet && git diff --staged --quiet || (git commit -m "📅 자동 업데이트: 국내 주식 시장 데이터 최신화" && git push)
