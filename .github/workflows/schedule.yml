
name: Daily KR Stock Data Update

on:
  schedule:
    # 매일 한국 시간 오후 4시 30분 (UTC 07:30)
    - cron: '30 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 체크아웃
      uses: actions/checkout@v4

    - name: 파이썬 환경 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 필수 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 데이터 수집 및 계산기 실행
      env:
        DART_API_KEY: ${{ secrets.DART_API_KEY }}
      run: |
        python kr_update_data.py

    - name: RS 이력 DB 저장 확인
      run: |
        python - <<'PY'
        import sqlite3
        import os

        db_path = "kr_ibd_system.db"

        if not os.path.exists(db_path):
            raise FileNotFoundError(f"DB 파일이 없습니다: {db_path}")

        conn = sqlite3.connect(db_path)
        cur = conn.cursor()

        cur.execute("""
            SELECT name FROM sqlite_master
            WHERE type = 'table' AND name = 'rs_history'
        """)

        if cur.fetchone() is None:
            conn.close()
            raise RuntimeError("rs_history 테이블이 없습니다.")

        cur.execute("""
            SELECT COUNT(*), MIN(date), MAX(date)
            FROM rs_history
        """)
        total, first_date, latest_date = cur.fetchone()

        print(f"RS 이력 전체 기록 수: {total}")
        print(f"RS 이력 최초 날짜: {first_date}")
        print(f"RS 이력 최신 날짜: {latest_date}")

        if latest_date:
            cur.execute("""
                SELECT COUNT(DISTINCT symbol), COUNT(*)
                FROM rs_history
                WHERE date = ?
            """, (latest_date,))
            symbols, records = cur.fetchone()
            print(f"최신 날짜 기록 종목 수: {symbols}")
            print(f"최신 날짜 기록 건수: {records}")

        print("최근 5개 날짜의 기록:")
        cur.execute("""
            SELECT date, COUNT(DISTINCT symbol), COUNT(*)
            FROM rs_history
            GROUP BY date
            ORDER BY date DESC
            LIMIT 5
        """)

        for date, symbols, records in cur.fetchall():
            print(f"  {date}: 종목 {symbols}개, 기록 {records}건")

        conn.close()
        PY

    - name: 변경된 DB 파일 깃허브에 업로드
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add kr_ibd_system.db
        git diff --quiet && git diff --staged --quiet || (git commit -m "📅 자동 업데이트: 국내 주식 시장 데이터 최신화" && git push)
